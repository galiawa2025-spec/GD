<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>GD - Gailan</title>
    
    <!-- iOS Web App Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="GD">
    <link rel="apple-touch-icon" href="app_logo.jpg">
    
    <style>
        :root {
            --navy-primary: #091D3E;
            --navy-dark: #051024;
            --burgundy: #600826;
            --pearl-bg: #F8F9FA;
            --flagged-bg: #FEE2E2;
            --flagged-border: #F87171;
            --flagged-badge: #DC2626;
            --normal-border: #E2E8F0;
            --call-green: #10B981;
            --wa-green: #25D366;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--pearl-bg);
            color: #1E293B;
            padding-bottom: env(safe-area-inset-bottom);
        }

        /* Top Header */
        .top-header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: #ffffff;
            box-shadow: 0 2px 6px rgba(0,0,0,0.06);
            padding: calc(env(safe-area-inset-top) + 10px) 12px 10px 12px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .toggle-btn {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            background: var(--navy-primary);
            color: white;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.2s;
            flex-shrink: 0;
        }

        .toggle-btn.employees {
            background: var(--burgundy);
        }

        .search-box {
            flex: 1;
            height: 48px;
            background: #F8FAFC;
            border: 1.2px solid #E2E8F0;
            border-radius: 12px;
            display: flex;
            align-items: center;
            padding: 0 12px;
            gap: 8px;
        }

        .search-box input {
            flex: 1;
            border: none;
            background: transparent;
            outline: none;
            font-size: 14px;
            text-align: right;
            user-select: auto;
        }

        .clear-btn {
            background: none;
            border: none;
            color: #94A3B8;
            font-size: 18px;
            cursor: pointer;
            display: none;
        }

        /* Lists */
        .content-container {
            padding: 12px;
            max-width: 600px;
            margin: 0 auto;
        }

        /* Cards */
        .card {
            background: white;
            border-radius: 16px;
            border: 1.2px solid var(--normal-border);
            padding: 14px 16px;
            margin-bottom: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.04);
            text-align: center;
            transition: all 0.25s ease;
            position: relative;
        }

        .card.flagged {
            background: var(--flagged-bg);
            border-color: var(--flagged-border);
            box-shadow: 0 3px 8px rgba(220, 38, 38, 0.15);
        }

        .driver-code {
            font-size: 22px;
            font-weight: 900;
            color: var(--navy-primary);
            margin-bottom: 6px;
        }

        .card.flagged .driver-code {
            color: var(--flagged-badge);
        }

        .driver-name-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: transparent;
            border: none;
            padding: 5px 12px;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            color: var(--navy-dark);
            cursor: pointer;
            margin-bottom: 6px;
        }

        .driver-name-btn.has-photo {
            background: #EFF6FF;
            color: var(--navy-primary);
        }

        .card.flagged .driver-name-btn.has-photo {
            background: rgba(252, 165, 165, 0.4);
            color: #991B1B;
        }

        .phone-row {
            background: #F8FAFC;
            border-radius: 10px;
            padding: 6px 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-top: 6px;
        }

        .phone-number {
            font-size: 15px;
            font-weight: bold;
            color: #334155;
            letter-spacing: 0.5px;
            direction: ltr;
        }

        .phone-btns {
            display: flex;
            gap: 8px;
        }

        .action-circle-btn {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            text-decoration: none;
            border: none;
            cursor: pointer;
        }

        .action-circle-btn.call {
            background: var(--call-green);
        }

        .action-circle-btn.wa {
            background: var(--wa-green);
        }

        .work-text {
            font-size: 14px;
            font-weight: 600;
            color: var(--burgundy);
            margin-top: 6px;
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.88);
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .modal-content {
            background: transparent;
            max-width: 90vw;
            max-height: 80vh;
            text-align: center;
            position: relative;
        }

        .modal-img {
            max-width: 100%;
            max-height: 70vh;
            border-radius: 14px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        .modal-close {
            position: absolute;
            top: -45px;
            left: 10px;
            background: white;
            color: #1E293B;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: none;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
        }

        /* Login Screen */
        .login-screen {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--pearl-bg);
            z-index: 500;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-card {
            background: white;
            border-radius: 24px;
            padding: 32px 24px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.08);
            text-align: center;
        }

        .gailan-header {
            font-size: 46px;
            font-style: italic;
            font-weight: bold;
            color: var(--navy-primary);
            font-family: "Snell Roundhand", cursive, serif;
            margin-bottom: 24px;
        }

        .login-input {
            width: 100%;
            height: 52px;
            border: 1.2px solid #CBD5E1;
            border-radius: 14px;
            padding: 0 16px;
            font-size: 16px;
            text-align: center;
            outline: none;
            margin-bottom: 12px;
            user-select: auto;
        }

        .login-btn {
            width: 100%;
            height: 52px;
            background: var(--navy-primary);
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .error-msg {
            color: #DC2626;
            font-size: 13px;
            margin-bottom: 12px;
            display: none;
        }

        /* Blocked Screen */
        .blocked-screen {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #FEF2F2;
            z-index: 999;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 24px;
            text-align: center;
        }

        .blocked-circle {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: #DC2626;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            margin: 0 auto 20px auto;
        }

        .blocked-title {
            font-size: 22px;
            font-weight: bold;
            color: #991B1B;
            margin-bottom: 10px;
        }

        .blocked-desc {
            font-size: 14px;
            color: #7F1D1D;
            line-height: 1.6;
        }

        /* Loading Spinner */
        .spinner {
            width: 36px;
            height: 36px;
            border: 3.5px solid #CBD5E1;
            border-top-color: var(--navy-primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 40px auto;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <!-- Login Screen -->
    <div id="loginScreen" class="login-screen">
        <div class="login-card">
            <div class="gailan-header">Gailan</div>
            <div id="errorMsg" class="error-msg">تێپەڕەوشە هەڵەیە یان بەکارهێنەر ناچالاکە</div>
            <input type="password" id="passwordInput" class="login-input" placeholder="تێپەڕەوشە بنووسە...">
            <button id="loginBtn" class="login-btn" onclick="handleLogin()">چوونە ژوورەوە</button>
        </div>
    </div>

    <!-- Blocked Screen -->
    <div id="blockedScreen" class="blocked-screen">
        <div>
            <div class="blocked-circle">⛔</div>
            <div class="blocked-title">ئەم ئامێرە وەستێنراوە!</div>
            <div class="blocked-desc">ئەم ئامێرە لەلایەن بەڕێوەبەرەوە لە سیستەمەکە ڕاگیراوە و ناتوانێت کار بە بەرنامەکە بکات.</div>
        </div>
    </div>

    <!-- Top Bar -->
    <div class="top-header">
        <button id="toggleTabBtn" class="toggle-btn" onclick="toggleTab()">
            <svg id="tabIcon" width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                <!-- Truck Icon (Default) -->
                <path d="M20 8h-3V4H3c-1.1 0-2 .9-2 2v11h2c0 1.66 1.34 3 3 3s3-1.34 3-3h6c0 1.66 1.34 3 3 3s3-1.34 3-3h2v-5l-3-4zM6 18.5c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm13.5-9l1.96 2.5H17V9.5h2.5zm-1.5 9c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/>
            </svg>
        </button>
        
        <div class="search-box">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="#64748B"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
            <input type="text" id="searchInput" placeholder="گەڕان بە کۆد، کۆدی نوێ، ناو، مۆبایل..." oninput="handleSearch()">
            <button id="clearSearchBtn" class="clear-btn" onclick="clearSearch()">&times;</button>
        </div>
    </div>

    <!-- Content Container -->
    <div class="content-container">
        <div id="loadingSpinner" class="spinner"></div>
        <div id="itemsList"></div>
    </div>

    <!-- Photo Preview Modal -->
    <div id="photoModal" class="modal-overlay" onclick="closePhotoModal()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <button class="modal-close" onclick="closePhotoModal()">&times;</button>
            <img id="modalImg" class="modal-img" src="" alt="Driver Photo">
        </div>
    </div>

    <script>
        const BASE_URL = "https://ga-sayaq-default-rtdb.europe-west1.firebasedatabase.app";
        let rawDrivers = [];
        let rawEmployees = [];
        let localFlags = {};
        let currentTab = 0; // 0 = Drivers, 1 = Employees
        let currentUser = localStorage.getItem("gd_username") || "مۆبایل";
        let isDeviceBlocked = false;

        // Auto-login check
        if (localStorage.getItem("gd_logged_in") === "true") {
            document.getElementById("loginScreen").style.display = "none";
            initApp();
        }

        async function handleLogin() {
            const pass = document.getElementById("passwordInput").value.trim();
            if (!pass) return;

            const btn = document.getElementById("loginBtn");
            btn.innerText = "...";
            btn.disabled = true;

            try {
                const res = await fetch(`${BASE_URL}/users.json`);
                const data = await res.json();
                let userFound = null;

                if (data) {
                    const users = Array.isArray(data) ? data.filter(Boolean) : Object.values(data);
                    for (const u of users) {
                        if (u.IsActive && u.Password === pass) {
                            userFound = u;
                            break;
                        }
                    }
                }

                if (userFound) {
                    currentUser = userFound.Username || "مۆبایل";
                    localStorage.setItem("gd_username", currentUser);
                    localStorage.setItem("gd_logged_in", "true");
                    document.getElementById("loginScreen").style.display = "none";
                    initApp();
                } else {
                    document.getElementById("errorMsg").style.display = "block";
                }
            } catch (e) {
                document.getElementById("errorMsg").style.display = "block";
            } finally {
                btn.innerText = "چوونە ژوورەوە";
                btn.disabled = false;
            }
        }

        function initApp() {
            startSyncLoop();
        }

        // Kurdish/Arabic Number Normalizer
        function normalizeDigits(str) {
            if (!str) return "";
            return str.replace(/[\u0660-\u0669]/g, c => c.charCodeAt(0) - 0x0660)
                      .replace(/[\u06F0-\u06F9]/g, c => c.charCodeAt(0) - 0x06F0);
        }

        // Code -> New Code (1 -> 1A, 27 -> 2A)
        function generateNewCode(code) {
            if (!code) return "";
            const norm = normalizeDigits(code).replace(/\D/g, "");
            const n = parseInt(norm);
            if (!isNaN(n) && n > 0) {
                const group = Math.floor((n - 1) / 26) + 1;
                const letter = String.fromCharCode(65 + ((n - 1) % 26));
                return `${group}${letter}`;
            }
            return code;
        }

        function parseCodeNumber(code) {
            if (!code) return 9999999;
            const norm = normalizeDigits(code).replace(/\D/g, "");
            const n = parseInt(norm);
            return isNaN(n) ? 9999999 : n;
        }

        function formatImageUrl(url) {
            if (!url) return "";
            let clean = url.trim().replace(/^["'`]|["'`]$/g, "");
            if (clean.includes("drive.google.com")) {
                let fileId = "";
                if (clean.includes("/file/d/")) {
                    fileId = clean.split("/file/d/")[1].split("/")[0].split("?")[0];
                } else if (clean.includes("id=")) {
                    fileId = clean.split("id=")[1].split("&")[0];
                }
                if (fileId) return `https://lh3.googleusercontent.com/d/${fileId}`;
            }
            if (clean.includes("dropbox.com") && clean.includes("dl=0")) {
                return clean.replace("dl=0", "dl=1");
            }
            return clean;
        }

        function formatForWhatsApp(phone) {
            let digits = normalizeDigits(phone).replace(/\D/g, "");
            if (digits.startsWith("00964")) return digits.substring(2);
            if (digits.startsWith("964")) return digits;
            if (digits.startsWith("07")) return "964" + digits.substring(1);
            if (digits.startsWith("7")) return "964" + digits;
            return digits;
        }

        // Sync Loop every 3 seconds
        async function syncData() {
            try {
                // 1. Heartbeat & Block Check
                const devId = localStorage.getItem("gd_dev_id") || "ios_" + Math.random().toString(36).substring(2, 9);
                localStorage.setItem("gd_dev_id", devId);

                const devRes = await fetch(`${BASE_URL}/devices/${devId}.json`);
                const devData = await devRes.json();
                if (devData && devData.IsBlocked) {
                    document.getElementById("blockedScreen").style.display = "flex";
                    return;
                } else {
                    document.getElementById("blockedScreen").style.display = "none";
                }

                // Heartbeat PATCH
                const now = new Date().toISOString().replace("T", " ").substring(0, 19);
                fetch(`${BASE_URL}/devices/${devId}.json`, {
                    method: "PATCH",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        DeviceId: devId,
                        DeviceName: "iPhone (iOS)",
                        DeviceType: "مۆبایل",
                        DeviceModel: "iPhone",
                        OperatingSystem: "iOS Safari PWA",
                        Username: currentUser,
                        Role: "شوفێر/فەرمانبەر",
                        IpAddress: "127.0.0.1",
                        LastSeen: now,
                        IsBlocked: false
                    })
                }).catch(()=>{});

                // 2. Fetch Drivers
                const dRes = await fetch(`${BASE_URL}/drivers.json`);
                const dData = await dRes.json();
                if (dData) {
                    const list = [];
                    if (Array.isArray(dData)) {
                        dData.forEach((d, idx) => {
                            if (d) list.push({ ...d, code: d.Code || d.code || `${idx}`, firebaseKey: `${idx}` });
                        });
                    } else {
                        Object.entries(dData).forEach(([k, d]) => {
                            if (d) list.push({ ...d, code: d.Code || d.code || k, firebaseKey: k });
                        });
                    }

                    rawDrivers = list.filter(d => {
                        const name = d.DriverName || d.driverName || d.OriginalDriverName || "";
                        const phone = d.Phone1 || d.phone1 || d.Phone2 || d.phone2 || "";
                        return (name && name.trim()) || (phone && phone.trim()) || (d.code && d.code !== "0");
                    }).map(d => {
                        const code = d.code;
                        const override = localFlags[code];
                        return {
                            ...d,
                            newCode: generateNewCode(code),
                            isFlagged: override !== undefined ? override : (d.IsFlagged || d.isFlagged || false)
                        };
                    }).sort((a, b) => parseCodeNumber(a.code) - parseCodeNumber(b.code));
                }

                // 3. Fetch Employees
                const eRes = await fetch(`${BASE_URL}/employees.json`);
                const eData = await eRes.json();
                if (eData) {
                    const elist = Array.isArray(eData) ? eData.filter(Boolean) : Object.values(eData);
                    rawEmployees = elist.sort((a, b) => (b.Id || 0) - (a.Id || 0));
                }

                document.getElementById("loadingSpinner").style.display = "none";
                renderList();
            } catch (e) {
                console.error(e);
            }
        }

        function startSyncLoop() {
            syncData();
            setInterval(syncData, 3000);
        }

        function toggleTab() {
            currentTab = currentTab === 0 ? 1 : 0;
            const btn = document.getElementById("toggleTabBtn");
            const icon = document.getElementById("tabIcon");
            const search = document.getElementById("searchInput");

            if (currentTab === 0) {
                btn.classList.remove("employees");
                icon.innerHTML = `<path d="M20 8h-3V4H3c-1.1 0-2 .9-2 2v11h2c0 1.66 1.34 3 3 3s3-1.34 3-3h6c0 1.66 1.34 3 3 3s3-1.34 3-3h2v-5l-3-4zM6 18.5c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm13.5-9l1.96 2.5H17V9.5h2.5zm-1.5 9c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/>`;
                search.placeholder = "گەڕان بە کۆد، کۆدی نوێ، ناو، مۆبایل...";
            } else {
                btn.classList.add("employees");
                icon.innerHTML = `<path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/>`;
                search.placeholder = "گەڕان بە ناو، کار، مۆبایل...";
            }
            renderList();
        }

        function handleSearch() {
            const query = document.getElementById("searchInput").value.trim();
            document.getElementById("clearSearchBtn").style.display = query ? "block" : "none";
            renderList();
        }

        function clearSearch() {
            document.getElementById("searchInput").value = "";
            document.getElementById("clearSearchBtn").style.display = "none";
            renderList();
        }

        function toggleFlag(code, currentFlag) {
            if (navigator.vibrate) navigator.vibrate(50);
            const newFlag = !currentFlag;
            localFlags[code] = newFlag;

            const idx = rawDrivers.findIndex(d => d.code === code);
            if (idx >= 0) rawDrivers[idx].isFlagged = newFlag;
            renderList();

            // PATCH to Firebase
            fetch(`${BASE_URL}/drivers/${code}.json`, {
                method: "PATCH",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ IsFlagged: newFlag, isFlagged: newFlag })
            }).catch(()=>{});
        }

        function openPhotoModal(url) {
            document.getElementById("modalImg").src = url;
            document.getElementById("photoModal").style.display = "flex";
        }

        function closePhotoModal() {
            document.getElementById("photoModal").style.display = "none";
        }

        function renderList() {
            const container = document.getElementById("itemsList");
            const query = normalizeDigits(document.getElementById("searchInput").value.trim().toLowerCase());

            if (currentTab === 0) {
                // Drivers
                let filtered = rawDrivers;
                if (query) {
                    filtered = rawDrivers.filter(d => {
                        const code = normalizeDigits(d.code).toLowerCase();
                        const newCode = normalizeDigits(d.newCode).toLowerCase();
                        const name = (d.DriverName || d.driverName || d.OriginalDriverName || "").toLowerCase();
                        const p1 = normalizeDigits(d.Phone1 || d.phone1 || "").toLowerCase();
                        const p2 = normalizeDigits(d.Phone2 || d.phone2 || "").toLowerCase();
                        return code.includes(query) || newCode.includes(query) || name.includes(query) || p1.includes(query) || p2.includes(query);
                    });
                }

                container.innerHTML = filtered.map(d => {
                    const codeDisplay = d.newCode ? `${d.code} - ${d.newCode}` : d.code;
                    const photo = formatImageUrl(d.PhotoUrl || d.photoUrl || d.ImageUrl || "");
                    const name = d.DriverName || d.driverName || d.OriginalDriverName || "";
                    const p1 = d.Phone1 || d.phone1 || "";
                    const p2 = d.Phone2 || d.phone2 || "";
                    const work = d.Work || d.work || "";

                    let p1Html = "";
                    if (p1) {
                        p1Html = `
                            <div class="phone-row">
                                <span class="phone-number">${p1}</span>
                                <div class="phone-btns">
                                    <a href="tel:${p1}" class="action-circle-btn call">📞</a>
                                    <a href="https://wa.me/${formatForWhatsApp(p1)}" target="_blank" class="action-circle-btn wa">💬</a>
                                </div>
                            </div>
                        `;
                    }

                    let p2Html = "";
                    if (p2) {
                        p2Html = `
                            <div class="phone-row">
                                <span class="phone-number">${p2}</span>
                                <div class="phone-btns">
                                    <a href="tel:${p2}" class="action-circle-btn call">📞</a>
                                    <a href="https://wa.me/${formatForWhatsApp(p2)}" target="_blank" class="action-circle-btn wa">💬</a>
                                </div>
                            </div>
                        `;
                    }

                    return `
                        <div class="card ${d.isFlagged ? 'flagged' : ''}" 
                             oncontextmenu="event.preventDefault(); toggleFlag('${d.code}', ${d.isFlagged}); return false;"
                             ondblclick="toggleFlag('${d.code}', ${d.isFlagged})">
                            <div class="driver-code">${codeDisplay}</div>
                            <button class="driver-name-btn ${photo ? 'has-photo' : ''}" ${photo ? `onclick="openPhotoModal('${photo}')"` : ''}>
                                ${photo ? '📷 ' : ''}${name}
                            </button>
                            ${p1Html}
                            ${p2Html}
                            ${work ? `<div class="work-text">${work}</div>` : ''}
                        </div>
                    `;
                }).join("");

            } else {
                // Employees
                let filtered = rawEmployees;
                if (query) {
                    filtered = rawEmployees.filter(e => {
                        const name = (e.Name || e.name || "").toLowerCase();
                        const work = (e.Work || e.work || "").toLowerCase();
                        const p = normalizeDigits(e.Phone || e.phone || "").toLowerCase();
                        return name.includes(query) || work.includes(query) || p.includes(query);
                    });
                }

                container.innerHTML = filtered.map(e => {
                    const name = e.Name || e.name || "";
                    const work = e.Work || e.work || "";
                    const phone = e.Phone || e.phone || "";

                    return `
                        <div class="card">
                            <div style="font-size: 18px; font-weight: bold; color: var(--navy-dark);">${name}</div>
                            ${work ? `<div class="work-text">${work}</div>` : ''}
                            ${phone ? `
                                <div class="phone-row">
                                    <span class="phone-number">${phone}</span>
                                    <div class="phone-btns">
                                        <a href="tel:${phone}" class="action-circle-btn call">📞</a>
                                        <a href="https://wa.me/${formatForWhatsApp(phone)}" target="_blank" class="action-circle-btn wa">💬</a>
                                    </div>
                                </div>
                            ` : ''}
                        </div>
                    `;
                }).join("");
            }
        }
    </script>
</body>
</html>
